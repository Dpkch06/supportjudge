<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportJudge</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/shell.css"><script src="/static/shell.js" defer></script></head>
<body><header><a href="/">SupportJudge</a></header>
<main class="new-experiment-page">
<section class="panel"><h2>New experiment</h2><div id="model-roles"></div>
<form id="experiment"><label>Dataset<select id="dataset"></select></label><label>Split<select id="split"><option value="development">Development</option><option value="heldout">Held out</option></select></label><label>Generator A<select id="generator-a" required></select></label><label>Generator B<select id="generator-b" required></select></label><label>Choose judges<select id="judge-selection"><option value="rotate">Rotate automatically each experiment</option><option value="manual">Choose my own judges</option></select></label><label id="judge-a-label" hidden>Judge 1<select id="judge-a"></select></label><label id="judge-b-label" hidden>Judge 2<select id="judge-b"></select></label><button id="run-button" disabled>Run comparison</button></form><p id="message" role="status"></p></section>

</main><script src="/static/app.js" defer></script></body></html>
