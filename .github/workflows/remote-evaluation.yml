name: Trusted live evaluation
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset installed on the evaluation service
        default: support-v1
        required: true
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Evaluate approved service
        env:
          SUPPORTJUDGE_URL: ${{ vars.SUPPORTJUDGE_URL }}
          DATASET: ${{ inputs.dataset }}
        run: python infra/gate_remote.py --url "$SUPPORTJUDGE_URL" --dataset "$DATASET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation-report
          path: reports/remote-gate.json
