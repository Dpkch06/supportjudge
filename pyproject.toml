[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportjudge"
version = "0.1.0"
description = "Customer support evaluation with calibrated LLM judges"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
supportjudge = "supportjudge_cli.cli:main"

[tool.setuptools]
packages = ["supportjudge_evaluation", "supportjudge_statistics", "supportjudge_api", "supportjudge_cli"]
package-dir = {supportjudge_evaluation = "packages/evaluation/supportjudge_evaluation", supportjudge_statistics = "packages/statistics/supportjudge_statistics", supportjudge_api = "services/api/supportjudge_api", supportjudge_cli = "infra/supportjudge_cli"}

[tool.pytest.ini_options]
pythonpath = ["packages/evaluation", "packages/statistics", "services/api", "infra"]
testpaths = ["packages", "services", "infra"]
